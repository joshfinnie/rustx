[package]
name = "rustx-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "Node",
  "NodeList",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "EventTarget",
  "Event",
  "CustomEvent",
  "CustomEventInit",
  "FormData",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "AbortController",
  "AbortSignal",
  "UrlSearchParams",
  "ViewTransition",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
